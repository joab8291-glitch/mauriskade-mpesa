name: Mauriskade backup code tests

on:
  pull_request:
    paths:
      - 'scripts/backup-database.js'
      - 'scripts/b2-backup-storage.js'
      - 'scripts/recovery-drill.js'
      - 'scripts/backup-supabase-managed.js'
      - 'scripts/recovery-drill-supabase-managed.js'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mauriskade-backup-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/backup-database.js'
      - 'scripts/b2-backup-storage.js'
      - 'scripts/recovery-drill.js'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mauriskade-backup-tests.yml'

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
