name: Node tests

on:
  push:
    branches:
      - main
      - feature/rent-only-tenancies
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: |
          node --check server.js
          node --check rent.js
          node --check rent-workflows.js
