name: Node tests

on:
  push:
    branches:
      - main
      - feature/rent-only-tenancies
      - feature/complete-audit-attribution
      - feature/mauriskade-private-storage-backups
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: |
          node --check server.js
          node --check rent.js
          node --check rent-workflows.js
          node --check scripts/backup-database.js
          node --check scripts/recovery-drill.js
          node --check scripts/b2-backup-storage.js
          node --check scripts/backup-supabase-managed.js
          node --check scripts/recovery-drill-supabase-managed.js
