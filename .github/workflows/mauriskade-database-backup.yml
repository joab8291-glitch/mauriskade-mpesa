name: Mauriskade encrypted database backup

on:
  schedule:
    - cron: "0 23 * * *" # 02:00 Africa/Nairobi
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mauriskade-database-backup
  cancel-in-progress: false

jobs:
  backup-and-restore-test:
    runs-on: ubuntu-latest
    services:
      restore-db:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restore-only-password
          POSTGRES_DB: restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install AWS CLI for Backblaze B2
        run: pipx install awscli
          pipx environment --value PIPX_BIN_DIR >> "$GITHUB_PATH"
          aws --version
      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/pgdg.asc
          sudo gpg --batch --yes --dearmor --output /etc/apt/keyrings/postgresql-pgdg.gpg /tmp/pgdg.asc
          echo "deb [signed-by=/etc/apt/keyrings/postgresql-pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo ${VERSION_CODENAME})-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - name: Prepare isolated restore database
        env:
          RESTORE_DATABASE_URL: postgresql://postgres:restore-only-password@localhost:5432/restore_test
        run: |
          psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;"
          test "$(psql "$RESTORE_DATABASE_URL" -Atc "SELECT current_database()")" = "restore_test"
      - name: Dump, encrypt, restore-test, then upload
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RENT_BACKUP_ENCRYPTION_KEY: ${{ secrets.RENT_BACKUP_ENCRYPTION_KEY }}
          RESTORE_DATABASE_URL: postgresql://postgres:restore-only-password@localhost:5432/restore_test
          RENT_BACKUP_STORAGE_BUCKET: mauriskade-db-backups
          RENT_BACKUP_RETENTION_DAYS: "90"
          B2_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
          B2_REGION: ${{ secrets.B2_REGION }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: node scripts/backup-database.js
